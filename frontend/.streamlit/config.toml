# Dark UI defaults for CareCompass India
[theme]
base = "dark"
primaryColor = "#d97706"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
